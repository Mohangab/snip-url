spring:
  application:
    name: snip-url
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/snip}
    username: ${DB_USER:snip}
    password: ${DB_PASSWORD:snip}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

snip:
  base-url: ${BASE_URL:http://localhost:8080}
