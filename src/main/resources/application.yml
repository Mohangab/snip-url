spring:
  application:
    name: snip-url
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/snip}
    username: ${DB_USER:snip}
    password: ${DB_PASSWORD:snip}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

snip:
  base-url: ${BASE_URL:http://localhost:8080}
  cache-ttl: 1h
  rate-limit:
    creates-per-minute: ${CREATE_RATE_LIMIT:30}
